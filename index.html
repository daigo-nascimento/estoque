<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem Vindo!</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    
    <link rel="stylesheet" href="./css/index.css">]
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

</head>
<body>
    <main class="container">
        <h1>Cadastro de Produtos</h1>
        <form action="#" method="post" id="cadastroProduto">

            <div class="row">
                
                <div class="form-field col-6">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" name="nome" id="nome" class="form-control" required>
                </div>

                <div class="form-field col-6">
                    <label for="valor" class="form-label">Valor</label>
                    <input type="number" class="form-control" required name="valor" id="valor" placeholder="0.00" >
                </div>
            </div>

            <div class="row">
                <div class="btn-group botoes col-12">
                    <button type="reset" class="btn-solid theme-secondary" id="botaoNovo">Novo</button>

                    <button type="submit" class="btn-solid theme-primary visible" id="botaoAdicionar">Adicionar</button>

                    <button type="button" class="btn-solid theme-primary invisible" id="botaoAlterar">Alterar</button>
                </div>
            </div>
        </form>
        <br>
    

        <table class="table">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Valor</th>
                    <th scope="col">Editar</i></th>
                </tr>   
            </thead>
            <tbody id="conteudo-tabela">
                
            </tbody>
            <tfoot>
                <tr>
                    <td></td>  
                    <td></td>  
                    <td>Valor total: <span></span></td>     
                </tr>
            </tfoot>
            
        </table>
        <br>
        <div class="row">
            <div class="text-end">
                Valor total: <span></span>
            </div>
        </div>
    </main>
    <script>
    let idProduto
    let nomeInput = document.querySelector('#nome')
    let valorInput = document.querySelector('#valor')
    let estoque = []
    let form = document.querySelector('#cadastroProduto')
    let botaoAlterar = document.querySelector('#botaoAlterar')
    let botaoAdicionar = document.querySelector('#botaoAdicionar')
    let botaoNovo = document.querySelector('#botaoNovo')


    form.addEventListener('submit', function(event) {
        event.preventDefault();
        //cancela a acao do evento, quer é submit
        console.log(event);

        //chama a outra funcao
        capturaFormulario(event);
    })

    
    botaoNovo.addEventListener('click', reset)
    botaoAlterar.addEventListener('click',()=> alterar(idProduto))

    function reset(){
    botaoAlterar.classList.replace('visible', 'invisible')
    botaoAdicionar.classList.replace('invisible', 'visible')
    }

    let botaoSubmit = document.querySelector('#botaoSubmit')
    botaoSubmit.addEventListener('mouseover', function(){
        console.log('oi')
    })
        function capturaFormulario(event) {
            // criar um vetor
            

            
            

            let produto = {
                nome: nomeInput.value,
                valor: valorInput.value
            }

           
            
            estoque.push(produto)
            

            
            atualizaTabela(estoque)
        }
        
        function atualizaTabela(estoque){
            let tbody = document.querySelector('#conteudo-tabela')
            let linhasDaTabela = document.querySelectorAll('#conteudo-tabela tr')
            linhasDaTabela.forEach(linha => linha.remove())
            
            //linha de texto não resumida
            //for (let index = 0; index < linhasDaTabela.length; index++) {
            //    let linha = linhasDaTabela[index]
            //    linha.remove()
            //} 

            
            for (let index = 0; index < estoque.length; index++) {
                let produto = estoque[index]
                produto.id =  index

                let tr = document.createElement('tr')
                tr.setAttribute('produto','id', produto.id)

                let tdId = document.createElement('td')
                tdId.textContent = index + 1

                let tdNome = document.createElement('td')
                tdNome.textContent = produto.nome

                let tdValor = document.createElement('td')
                tdValor.textContent = produto.valor

                let tdEditar = document.createElement('td')


                //let aRemover = document.createElement('a')
                //aRemover.textContent = 'Remover'
                //Remover.setAttribute('href', "javascript:remover(produto.id)")
                //aRemover.setAttribute('href', `javascript:remover(${produto.id})`)
                //aRemover.addEventListener('click', function(){
                //    remover(produto.id)
                //})
                
                let iRemover = document.createElement('i')
                iRemover.setAttribute( 'class', 'bi bi-trash3 remover')
                
                iRemover.addEventListener('click',() => remover(produto.id))               
                
                iRemover.addEventListener('mouseover',() => {
                    iRemover.classList.replace('bi-trash3', 'bi-trash3-fill')
                })
                iRemover.addEventListener('mouseleave',() => {   
                    iRemover.classList.replace('bi-trash3-fill', 'bi-trash3')
                })

                let iEditar = document.createElement('i')
                iEditar.setAttribute('class', 'bi bi-pencil editar')
                
                iEditar.addEventListener('click',() => carregar(produto))

                iEditar.addEventListener('mouseover',() => {
                    iEditar.classList.replace('bi-pencil', 'bi-pencil-fill')
                })
                iEditar.addEventListener('mouseleave',() => {   
                    iEditar.classList.replace('bi-pencil-fill', 'bi-pencil')
                })



                //let aEditar = document.createElement('a')
                //aEditar.textContent = 'Editar'
                //aEditar.setAttribute('href', `javascript:editar(${produto.id})`)





                
                
                tdEditar.append(iEditar , ' ' , iRemover)
                

                tr.append(tdId)
                tr.append(tdNome)
                tr.append(tdValor)
                tr.append(tdEditar)
                
                tbody.append(tr)
            }
        }

        function remover(id){
            estoque.splice(id, 1)
            atualizaTabela(estoque)
        }


        function carregar(produto){
            nomeInput.value = produto.nome
            valorInput.value = produto.valor
            idProduto = produto.id
            //atlterar o botao de adicionar para invisible
            
            botaoAlterar.classList.replace('invisible', 'visible')
            
            botaoAdicionar.classList.replace('visible', 'invisible')

        }

        function alterar(id){
            //ao clicar
            
            
            
            estoque[id] = {
                nome: nomeInput.value,
                valor: valorInput.value
            }
            
            reset()
            atualizaTabela(estoque)
        }
    </script>
    
</body>
</html>
